name: 打包 Windows 安装包

# 推到 main 就跑（只改文档不跑），也可以手动触发。产物是一个未签名的 NSIS
# 安装包：不需要任何密钥，也不用登录任何服务。公共仓库的 Windows 运行时间
# 是免费的。
#
# 除了存成 workflow 产物（下载需要登录 GitHub），同一个安装包会被挂到一个固定的
# 预发布 Release（tag: win-dev）上，每次构建覆盖上一份，这样拿到的是一条
# 可以直接点开的链接。
on:
  push:
    branches: main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    name: NSIS 安装包（未签名）
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # `tauri.windows.conf.json` 是本仓库唯一的 Windows 配置：identifier、
      # nsis 目标、installMode、语言表、卸载钩子都在里面。基础配置只有 dmg/app，
      # 不带这个文件会直接打不出 Windows 包。
      - name: 打包
        run: npx tauri build --config src-tauri/tauri.windows.conf.json

      - name: 产物
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe
          $exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.FullName, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: tiez-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # 预发布 + 覆盖上传：Release 页面上永远只有当前这一份，不会越积越多。
      # Windows runner 默认用 PowerShell，这一步是 shell 脚本，必须点名 bash。
      #
      # 失败不算构建失败（安装包在「产物」那一步已经上传成 workflow 产物了），但一定要把
      # gh 的原文贴到 annotation 上：日志正文要登录才看得到，annotation 不用。
      - name: 挂到 win-dev 预发布
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          notes='自动构建的 Windows 安装包（未签名，第一次运行需要点「更多信息 → 仍要运行」）。
          这一条由 GitHub Actions 在每次推送到 main 后覆盖，永远对应仓库最新代码。
          正式版本请看 tag `v*`。'
          err=$(mktemp)
          # checkout 之后 HEAD 是分离的，不指定 target 时 gh 会拿不到分支名，
          # 建 tag 这一步就会失败；直接写死这次构建的 commit。
          gh release create win-dev \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Windows 安装包（自动构建）" \
            --notes "$notes" 2>"$err"
          code=$?
          if [ $code -ne 0 ] && ! grep -qi "already exists" "$err"; then
            echo "::error::创建 Release 失败（gh 退出码 $code）：$(tr '\n' ' ' <"$err")"
            exit 1
          fi
          if ! gh release upload win-dev "$exe" --clobber 2>"$err"; then
            echo "::error::上传安装包失败：$(tr '\n' ' ' <"$err")"
            exit 1
          fi
          echo "::notice::https://github.com/${{ github.repository }}/releases/tag/win-dev"
