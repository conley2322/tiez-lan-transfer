name: Release Beta (macOS)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to build
        required: true
        default: beta/1.0.0-beta.1

jobs:
  release:
    permissions:
      contents: write
    environment: macos-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            display_name: Intel
          - platform: macos-14
            display_name: Apple-Silicon

    runs-on: ${{ matrix.platform }}
    env:
      TIEZ_PLATFORM: macos
      TIEZ_RELEASE_CHANNEL: beta
      TIEZ_ANNOUNCEMENT_PING_URL: ${{ vars.TIEZ_ANNOUNCEMENT_PING_URL }}
      VITE_TIEZ_ANNOUNCEMENT_PING_URL: ${{ vars.TIEZ_ANNOUNCEMENT_PING_URL }}
      TIEZ_UPDATE_ENDPOINT: ${{ vars.TIEZ_UPDATE_ENDPOINT }}
      VITE_TIEZ_UPDATE_ENDPOINT: ${{ vars.VITE_TIEZ_UPDATE_ENDPOINT }}
      TIEZ_UPDATER_PUBLIC_KEY: ${{ vars.TIEZ_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: install frontend dependencies
        run: npm ci

      - name: prepare release config
        run: node scripts/configure-release.mjs

      - name: validate release metadata
        run: npm run validate-release

      # Developer ID signing + notarization, only once the Apple secrets exist.
      # Unset secrets expand to "", which would make the bundler try to sign
      # with an empty certificate, so export them only when present; without
      # them the build stays ad-hoc signed as before.
      - name: configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "macOS signing: $APPLE_SIGNING_IDENTITY"
            # Expiry reminder: past the date, CI can no longer sign new builds
            # (already notarized releases keep working).
            END=$(echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12" && \
              openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -clcerts 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2) || true
            rm -f "$RUNNER_TEMP/cert.p12"
            if [ -n "$END" ]; then
              DAYS=$(( ( $(date -j -f "%b %e %T %Y %Z" "$END" +%s) - $(date +%s) ) / 86400 ))
              echo "Developer ID certificate expires $END ($DAYS days left)"
              if [ "$DAYS" -lt 30 ]; then
                echo "::warning::Developer ID certificate expires in $DAYS days ($END). Create a new one (G2 Sub-CA) and update the APPLE_CERTIFICATE secret."
              fi
            fi
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "macOS notarization: enabled"
            else
              echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not set; the app is signed but not notarized"
            fi
          else
            echo "::warning::Apple signing secrets not set; building ad-hoc signed (users get Keychain prompts after each update)"
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TIEZ_ANNOUNCEMENT_PING_URL: ${{ vars.TIEZ_ANNOUNCEMENT_PING_URL }}
          VITE_TIEZ_ANNOUNCEMENT_PING_URL: ${{ vars.TIEZ_ANNOUNCEMENT_PING_URL }}
          TIEZ_UPDATE_ENDPOINT: ${{ vars.TIEZ_UPDATE_ENDPOINT }}
          VITE_TIEZ_UPDATE_ENDPOINT: ${{ vars.VITE_TIEZ_UPDATE_ENDPOINT }}
          TIEZ_UPDATER_PUBLIC_KEY: ${{ vars.TIEZ_UPDATER_PUBLIC_KEY }}
        with:
          tagName: beta-mac-v__VERSION__
          releaseName: TieZ macOS beta v__VERSION__
          releaseBody: Beta build for community testing. Channel=beta; can update to newer beta or stable when published.
          releaseDraft: true
          prerelease: true

      - name: Upload beta bundles
        uses: actions/upload-artifact@v4
        with:
          name: macos-beta-${{ matrix.display_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.tar.gz
            src-tauri/target/**/bundle/macos/*.sig
